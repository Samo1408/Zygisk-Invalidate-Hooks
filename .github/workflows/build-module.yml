name: Build Zygisk module

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install project SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709"

      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/module-build-start"
          chmod +x ./gradlew
          ./gradlew :module:zipRelease --no-daemon

      - name: Verify freshly built module
        id: module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find module/release -maxdepth 1 -type f -name '*-release.zip' \
            -newer "$RUNNER_TEMP/module-build-start" -print0)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one newly built release module ZIP, found ${#archives[@]}."
            exit 1
          fi
          python3 - "${archives[0]}" <<'PY'
          import sys
          from zipfile import ZipFile

          path = sys.argv[1]
          required = {
              "module.prop",
              "customize.sh",
              "webroot/index.html",
              "webroot/ui-enhancements.js",
              *(
                  f"lib/{abi}/libinline_hook_spoof.so"
                  for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")
              ),
          }
          with ZipFile(path) as archive:
              missing = required - set(archive.namelist())
              corrupt = archive.testzip()
              if missing or corrupt:
                  raise SystemExit(f"Invalid module ZIP: missing={sorted(missing)}, corrupt={corrupt}")
          print(f"Verified module ZIP: {path}")
          PY
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-module-release
          path: ${{ steps.module.outputs.path }}
          if-no-files-found: errPK