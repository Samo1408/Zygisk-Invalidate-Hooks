name: Build Zygisk module

on:
  
  

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709"

      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/module-build-start"
          chmod +x ./gradlew
          ./gradlew :module:zipRelease --no-daemon

      - name: Verify freshly built module
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(module/release/*-release.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one release ZIP in module/release; found ${#archives[@]}"
            printf '%s\\n' "${archives[@]}"
            exit 1
          fi
          python3 - "${archives[0]}" <<'PY'
          import sys
          from zipfile import ZipFile, BadZipFile
          path = sys.argv[1]
          required = {"module.prop", "customize.sh", "post-fs-data.sh", "webroot/index.html"}
          try:
              with ZipFile(path) as z:
                  names = set(z.namelist())
                  missing = required - names
                  if missing:
                      raise SystemExit("Module ZIP is missing: " + ", ".join(sorted(missing)))
                  bad = z.testzip()
                  if bad:
                      raise SystemExit("Corrupt ZIP member: " + bad)
          except BadZipFile as e:
              raise SystemExit("Invalid module ZIP: " + str(e))
          print("Verified module ZIP:", path)
          PY

      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-module-release
          path: module/release/*-release.zip
          if-no-files-found: error
