name: Build Zygisk module

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install project SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709"

      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/module-build-start"
          sed -i 's/\r$//' ./gradlew
          head -n 1 ./gradlew | grep -Fx '#!/usr/bin/env sh'
          chmod +x ./gradlew
          ./gradlew :module:zipRelease --no-daemon

      - name: Verify freshly built module
        id: module
        run: python3 .github/scripts/verify-module.py "$RUNNER_TEMP/module-build-start" "$GITHUB_OUTPUT"

      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-module-release
          path: ${{ steps.module.outputs.path }}
          if-no-files-found: error
